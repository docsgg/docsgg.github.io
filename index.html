<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kodewt</title>
    <style>
        /* reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            font-weight: 400;
            color: #111;
            line-height: 1.5;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
        }

        /* header */
        .site-header {
            text-align: center;
            padding: 2.5rem 0 1.5rem 0;
            border-bottom: 1px solid #eee;
            margin-bottom: 2.5rem;
        }

        .site-header h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: #111;
        }

        .site-header h1 span {
            font-weight: 400;
            color: #222;
        }

        /* description */
        .intro {
            text-align: center;
            font-size: 1.1rem;
            color: #333;
            max-width: 580px;
            margin: 0 auto 2.8rem auto;
            padding: 0 0.5rem;
            line-height: 1.6;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 2.5rem;
        }

        .intro p {
            margin: 0;
        }

        .intro .emoji {
            display: inline-block;
            margin: 0 2px;
        }

        /* cards */
        .projects {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            margin-bottom: 3.5rem;
        }

        .project-card {
            background: #fafafa;
            border-radius: 20px;
            padding: 1.8rem 2rem;
            border: 1px solid #f0f0f0;
            transition: background 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .project-card:hover {
            background: #f5f5f5;
            border-color: #e0e0e0;
        }

        .project-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .project-name {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: #111;
        }

        .project-desc {
            font-size: 0.95rem;
            color: #666;
        }

        .project-link {
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 450;
            letter-spacing: 0.3px;
            transition: background 0.15s ease, transform 0.1s ease;
            border: none;
            white-space: nowrap;
            margin-left: 1rem;
        }

        .project-link:hover {
            background: #2a2a2a;
            transform: scale(0.97);
        }

        .project-link:active {
            transform: scale(0.94);
        }

        /* footer */
        .site-footer {
            text-align: center;
            padding: 2rem 0 1rem 0;
            border-top: 1px solid #f0f0f0;
            color: #aaa;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            margin-top: 0.5rem;
        }

        .site-footer span {
            color: #ccc;
        }

        /* small screens */
        @media (max-width: 500px) {
            body {
                padding: 1.2rem 1rem;
            }

            .site-header h1 {
                font-size: 2.2rem;
            }

            .intro {
                font-size: 1rem;
                padding: 0 0.2rem 2rem 0.2rem;
            }

            .project-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
                padding: 1.5rem;
            }

            .project-link {
                margin-left: 0;
                align-self: flex-start;
                padding: 0.4rem 1.2rem;
                font-size: 0.85rem;
            }

            .project-name {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- header -->
    <header class="site-header">
        <h1>kodewt</h1>
    </header>

    <!-- description -->
    <div class="intro">
        <p>
            hey! i’m an indie dev and i make smt on the web and creating levels in gd :)
            <br />
            my games are a bit buggy bcz it’s the first version, but i’ll fix it (mb).
        </p>
    </div>

    <!-- projects -->
    <div class="projects">

        <!-- colored squares -->
        <div class="project-card">
            <div class="project-info">
                <div class="project-name">colored squares</div>
                <div class="project-desc">drag &amp; swap puzzle</div>
            </div>
            <a href="/cs" class="project-link">/cs</a>
        </div>

        <!-- the clicking game -->
        <div class="project-card">
            <div class="project-info">
                <div class="project-name">the clicking game</div>
                <div class="project-desc">click the smiley, get points</div>
            </div>
            <a href="/tcg" class="project-link">/tcg</a>
        </div>

    </div>

    <!-- footer -->
    <footer class="site-footer">
        <span>kodewt</span>
    </footer>

</div>

</body>
</html>
